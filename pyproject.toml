[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-bare-metal"
version = "0.1.0"
description = "Bare-metal llama.cpp + OpenAI-compatible router (drop-in replacement for the Docker stack)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "shell: tests that spawn subprocesses (slower, hit real bash)",
]

[tool.coverage.run]
branch = true
source = ["llama_bare"]

[tool.coverage.report]
# We want 100% on the Python modules. Fail the run if any line is missed.
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]